<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Warenkorb – AquaTreishop</title>

<style>

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Arial, Helvetica, sans-serif;
  background: #f5f7f8;
  color: #172126;
}

header {
  background: #071f26;
  color: white;
}

.header-inner {
  max-width: 1100px;
  margin: auto;
  padding: 18px 20px;

  display: flex;
  align-items: center;
  justify-content: space-between;
}

.logo {
  color: white;
  text-decoration: none;
  font-size: 24px;
  font-weight: 800;
}

.logo span {
  color: #4ed7c0;
}

.back {
  color: white;
  text-decoration: none;
  font-size: 14px;
}

main {
  max-width: 1100px;
  margin: auto;
  padding: 45px 20px;
}

h1 {
  margin: 0 0 30px;
  font-size: 36px;
}

.layout {
  display: grid;
  grid-template-columns: 1fr 350px;
  gap: 25px;
  align-items: start;
}

.card {
  background: white;
  border: 1px solid #e0e7e9;
  border-radius: 18px;
  padding: 20px;
}

.cart-item {
  display: grid;
  grid-template-columns: 90px 1fr auto;
  gap: 18px;
  padding: 18px 0;
  border-bottom: 1px solid #e7edef;
  align-items: center;
}

.cart-item:first-child {
  padding-top: 0;
}

.cart-item:last-child {
  border-bottom: 0;
  padding-bottom: 0;
}

.image {
  width: 90px;
  height: 90px;
  border-radius: 12px;
  overflow: hidden;
  background: #e8f0f1;

  display: flex;
  align-items: center;
  justify-content: center;
}

.image img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}

.placeholder {
  font-size: 30px;
}

.name {
  font-weight: 750;
  margin-bottom: 7px;
}

.price {
  color: #617176;
  font-size: 14px;
}

.quantity {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-top: 12px;
}

.quantity button {
  width: 30px;
  height: 30px;
  border: 1px solid #ccd7da;
  background: white;
  border-radius: 7px;
  cursor: pointer;
  font-size: 17px;
}

.quantity span {
  min-width: 25px;
  text-align: center;
}

.item-total {
  font-weight: 800;
  white-space: nowrap;
}

.remove {
  border: 0;
  background: none;
  color: #a33;
  cursor: pointer;
  padding: 5px 0;
  font-size: 13px;
}

.summary h2 {
  margin-top: 0;
}

.row {
  display: flex;
  justify-content: space-between;
  gap: 20px;
  padding: 10px 0;
}

.total {
  border-top: 1px solid #dfe7e9;
  margin-top: 10px;
  padding-top: 18px;
  font-size: 21px;
  font-weight: 800;
}

.free {
  color: #08775d;
  font-weight: 700;
}

.shipping-info {
  background: #eef9f6;
  color: #176b59;
  padding: 12px;
  border-radius: 10px;
  margin: 15px 0;
  font-size: 14px;
  line-height: 1.5;
}

.checkout {
  display: block;
  width: 100%;
  margin-top: 20px;
  padding: 15px;
  border: 0;
  border-radius: 12px;
  background: #082a32;
  color: white;
  font-size: 16px;
  font-weight: 800;
  cursor: pointer;
  text-align: center;
  text-decoration: none;
}

.continue {
  display: block;
  text-align: center;
  margin-top: 14px;
  color: #52666b;
  text-decoration: none;
  font-size: 14px;
}

.empty {
  text-align: center;
  padding: 70px 20px;
}

.empty-icon {
  font-size: 55px;
  margin-bottom: 15px;
}

.empty h2 {
  margin-bottom: 10px;
}

.empty p {
  color: #6d7b80;
}

.empty a {
  display: inline-block;
  margin-top: 15px;
  padding: 13px 18px;
  border-radius: 10px;
  background: #082a32;
  color: white;
  text-decoration: none;
  font-weight: 700;
}

@media (max-width: 750px) {

  .layout {
    grid-template-columns: 1fr;
  }

  h1 {
    font-size: 30px;
  }

  .cart-item {
    grid-template-columns: 70px 1fr;
  }

  .image {
    width: 70px;
    height: 70px;
  }

  .item-total {
    grid-column: 2;
  }

}

</style>
</head>

<body>

<header>

  <div class="header-inner">

    <a class="logo" href="index.html">
      Aqua<span>Treishop</span>
    </a>

    <a class="back" href="index.html">
      ← Weiter einkaufen
    </a>

  </div>

</header>


<main>

  <h1>Dein Warenkorb</h1>

  <div id="cartArea"></div>

</main>


<script>

let cart =
  JSON.parse(
    localStorage.getItem("aquatreishop_cart") || "[]"
  );


function formatPrice(value) {

  return new Intl.NumberFormat(
    "de-DE",
    {
      style: "currency",
      currency: "EUR"
    }
  ).format(value);

}


function saveCart() {

  localStorage.setItem(
    "aquatreishop_cart",
    JSON.stringify(cart)
  );

}


function renderCart() {

  const area =
    document.getElementById("cartArea");


  if (!cart.length) {

    area.innerHTML = `

      <div class="card empty">

        <div class="empty-icon">
          🛒
        </div>

        <h2>
          Dein Warenkorb ist leer
        </h2>

        <p>
          Entdecke unser Sortiment und
          füge deine ersten Produkte hinzu.
        </p>

        <a href="index.html">
          Zum Sortiment
        </a>

      </div>

    `;

    return;
  }


  let subtotal = 0;


  let itemsHtml =
    cart.map((item, index) => {

      const price =
        Number(item.price_cents) / 100;

      const total =
        price * Number(item.quantity);

      subtotal += total;


      const image =
        item.image_url

          ? `
            <img
              src="${escapeHtml(item.image_url)}"
              alt="${escapeHtml(item.name)}"
            >
          `

          : `
            <div class="placeholder">
              🌿
            </div>
          `;


      return `

        <div class="cart-item">

          <div class="image">
            ${image}
          </div>


          <div>

            <div class="name">
              ${escapeHtml(item.name)}
            </div>

            <div class="price">
              ${formatPrice(price)}
            </div>


            <div class="quantity">

              <button
                onclick="changeQuantity(${index}, -1)"
              >
                −
              </button>

              <span>
                ${item.quantity}
              </span>

              <button
                onclick="changeQuantity(${index}, 1)"
              >
                +
              </button>

            </div>


            <button
              class="remove"
              onclick="removeItem(${index})"
            >
              Entfernen
            </button>

          </div>


          <div class="item-total">

            ${formatPrice(total)}

          </div>

        </div>

      `;

    }).join("");


  const shipping =
    subtotal >= 70
      ? 0
      : 6.99;


  const total =
    subtotal + shipping;


  let shippingMessage;


  if (shipping === 0) {

    shippingMessage = `
      <div class="shipping-info">
        🎉 Glückwunsch! Deine Bestellung
        ist versandkostenfrei.
      </div>
    `;

  } else {

    const missing =
      70 - subtotal;

    shippingMessage = `
      <div class="shipping-info">
        Noch ${formatPrice(missing)}
        bis zum kostenlosen Versand
        ab 70 €.
      </div>
    `;

  }


  area.innerHTML = `

    <div class="layout">


      <div class="card">

        ${itemsHtml}

      </div>


      <div class="card summary">

        <h2>
          Zusammenfassung
        </h2>


        <div class="row">

          <span>
            Zwischensumme
          </span>

          <strong>
            ${formatPrice(subtotal)}
          </strong>

        </div>


        <div class="row">

          <span>
            Versand
          </span>

          <strong class="${
            shipping === 0 ? "free" : ""
          }">

            ${
              shipping === 0
                ? "Kostenlos"
                : formatPrice(shipping)
            }

          </strong>

        </div>


        ${shippingMessage}


        <div class="row total">

          <span>
            Gesamt
          </span>

          <strong>
            ${formatPrice(total)}
          </strong>

        </div>


        <a
          class="checkout"
          href="checkout.html"
        >
          Zur Kasse
        </a>


        <a
          class="continue"
          href="index.html"
        >
          ← Weiter einkaufen
        </a>

      </div>

    </div>

  `;

}


function changeQuantity(index, change) {

  cart[index].quantity += change;


  if (cart[index].quantity <= 0) {

    cart.splice(index, 1);

  }


  saveCart();

  renderCart();

}


function removeItem(index) {

  cart.splice(index, 1);

  saveCart();

  renderCart();

}


function escapeHtml(value) {

  return String(value || "")
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


renderCart();

</script>

</body>
</html>
